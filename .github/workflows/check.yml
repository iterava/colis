name: check

on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check formatting, lint, and types
        run: vp run -w check

      - name: Run tests
        run: vp run -w test

      - name: Build packages
        run: vp run -w build

      - name: Smoke packed tarballs
        run: vp run -w smoke:tarballs
