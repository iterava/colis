name: auto-merge-preview

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'preview' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (rebase)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --rebase --auto
